version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: codeinspire-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: codeinspire
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./codeinspire-backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeinspire-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: codeinspire-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeinspire-network

  # Qdrant 向量数据库 (可选)
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: codeinspire-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - codeinspire-network

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeinspire-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/codeinspire?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      JWT_SECRET: ${JWT_SECRET:-CodeInspireSecretKeyForProduction2024}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-your-deepseek-api-key}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-your-zhipu-api-key}
      QWEN_API_KEY: ${QWEN_API_KEY:-your-qwen-api-key}
      MIMO_API_KEY: ${MIMO_API_KEY:-your-mimo-api-key}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - codeinspire-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  codeinspire-network:
    driver: bridge

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: codeinspire
  datasource:
    url: jdbc:mysql://localhost:3306/codeinspire?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.codeinspire.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: CodeInspireSecretKey2024ForJWTTokenGenerationAndValidationMustBeLongEnough
  expiration: 86400000
  header: Authorization
  prefix: Bearer 

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  rate-limit:
    requests-per-minute: 30
    ai-calls-per-day: 100

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.codeinspire: debug
    org.springframework.security: debug
